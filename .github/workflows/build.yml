name: Build

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release, minsizerel]
        plat:
          - name: linux / x86_64
            toolchain: clang
            stdlib: libstdc++
            arch: x86_64
            os_name: ubuntu22
            runner: ubuntu-22.04
          - name: linux / arm64
            toolchain: clang
            stdlib: libstdc++
            arch: arm64
            os_name: ubuntu22
            runner: ubuntu-22.04-arm
    name: ${{ matrix.mode }} / ${{ matrix.plat.name }}
    runs-on: ${{ matrix.plat.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore conan cache
        uses: actions/cache@v6
        with:
          path: |
            ./.conan2/p
          key: conan-${{ matrix.plat.runner }}-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            conan-${{ matrix.plat.runner }}-

      - name: Setup conan
        uses: conan-io/setup-conan@v1
        with:
          cache_packages: true

      - name: Install dependencies
        run: |
          conan install . -pr:a build-${{ matrix.plat.toolchain }}-${{ matrix.plat.stdlib }}-${{ matrix.mode }} -b missing -of=build/conan

      - name: Configure
        run: |
          meson setup build --native-file build/conan/conan_meson_native.ini

      - name: Build
        run: |
          source build/conan/conanbuild.sh
          meson compile -C build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maiserver-${{ matrix.plat.os_name }}-${{ matrix.plat.arch }}-${{ matrix.mode }}
          path: |
            build/libmaiserver.so

  upload:
    name: Upload to release
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Delete all assets from release
        run: |
          set -e

          ASSETS=$(gh release view "$RELEASE_TAG" --json assets -q '.assets[].name')

          for asset in $ASSETS; do
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done

      - name: Compress all artifacts
        run: |
          set -e

          cd artifacts
          
          for d in */; do
            name="${d%/}"
            echo "Compressing $name -> $name.zip"
          
            zip -r "${name}.zip" "$name"
            rm -rf "$name"
          done

      - name: Upload new assets to release
        run: |
          gh release edit "$RELEASE_TAG" --notes "snapshot https://github.com/Redbeanw44602/maiserver/commit/$GITHUB_SHA at \`$(date -u +"%Y-%m-%d %H:%M:%S UTC")\`"
          gh release upload "$RELEASE_TAG" artifacts/* --clobber
